# ── medicaid-ee-service ───────────────────────────────────────────────────────────

enum MedicaidEeCaseStatus { PENDING_VERIFICATION IN_REVIEW APPROVED DENIED CANCELED }
enum MedicaidEeCaseType { INITIAL RENEWAL REDETERMINATION APPEAL }
enum DeterminationStatus { PENDING ELIGIBLE INELIGIBLE DEFERRED }
enum EligibilityCategory { MAGI NON_MAGI }
enum IncomeVerificationStatus { PENDING CONNECTED VERIFIED FAILED }
enum AssetVerificationStatus { PENDING VERIFIED FAILED }

enum MedicaidEeErrorCode {
  NOT_FOUND
  VALIDATION_ERROR
  UNIQUE_CONSTRAINT
  INVALID_STATUS_TRANSITION
  CONCURRENT_MODIFICATION
  DOCUMENT_COPY_FAILED
  DOCUMENT_SCAN_PENDING
  RFI_ALREADY_PENDING
  EVALUATION_FAILED
}

type MedicaidEeError {
  code: MedicaidEeErrorCode!
  field: String
  message: String!
}

type MedicaidEeRfiDetails {
  itemsRequested: [String!]!
  deadline: DateTime!
  noteToApplicant: String
  issuedAt: DateTime!
  """Opaque actor identifier of the caseworker who issued the RFI."""
  issuedBy: ID!
  renewalFormDocumentId: String
}

type IncomeVerificationEmployer {
  name: String!
  logoUrl: String
}

type IncomeVerification {
  status: IncomeVerificationStatus!
  employer: IncomeVerificationEmployer
  employmentType: String
  """Annual gross income in cents."""
  incomeAnnual: Int
  """Monthly gross income in cents."""
  incomeMonthly: Int
  hoursPerWeek: Float
  payFrequency: String
  lastPaystubDate: String
  verifiedAt: String
}

type AssetAccount {
  institutionName: String!
  accountType: String!
  """Balance in dollars."""
  balance: Int!
}

type AssetVerification {
  status: AssetVerificationStatus!
  totalAssets: Int
  accounts: [AssetAccount!]!
  verifiedAt: String
}

type MedicaidEeDetermination {
  id: ID!
  customerId: ID!
  caseId: ID!
  personId: ID
  coverageGroup: String
  person: PersonRecord
  status: DeterminationStatus!
  category: EligibilityCategory!
  effectiveDate: DateTime
  expirationDate: DateTime
  denialReason: String
  notes: String
  determinedAt: DateTime
  determinedBy: String
  noticeDocumentId: ID
  createdAt: DateTime!
  updatedAt: DateTime!
}

type MedicaidEeCaseDocument {
  id: ID!
  caseId: ID!
  s3Key: String!
  """e.g. proof-of-disenrollment | proof-of-residence"""
  documentCategory: String!
  createdAt: DateTime!
  # --- demo additions (additive to the supergraph shape) ---
  fileName: String!
  mimeType: String!
  sizeBytes: Int!
  uploadedAt: DateTime!
  """verify_assist (uploaded in the hosted flow) | resident_upload"""
  source: String!
  """Same-origin URL streaming the bytes to the owner or staff: /api/documents/<id>/content"""
  url: String!
}

"""Proof of disenrollment the applicant uploaded in the Verify Assist hosted flow."""
type VerificationProofDocument {
  id: ID!
  fileName: String!
  mimeType: String!
  sizeBytes: Int!
  uploadedAt: DateTime!
  url: String!
}

type MedicaidEeCase {
  id: ID!
  customerId: ID!
  householdId: ID!
  applicantPersonId: ID!
  household: Household!
  caseNumber: String
  caseType: MedicaidEeCaseType!
  status: MedicaidEeCaseStatus!
  statusReason: String
  notes: String
  flagReason: String
  intakeData: JSON
  ruleEvaluations: JSON
  rfiDetails: MedicaidEeRfiDetails
  documentId: ID
  linkedCaseId: ID
  linkedCase: MedicaidEeCase
  """Case Assist narrative (template, or Claude when ANTHROPIC_API_KEY is set)."""
  caseAssistNarrative: String
  determinations: [MedicaidEeDetermination!]!
  documents: [MedicaidEeCaseDocument!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  incomeVerification: IncomeVerification
  assetVerification: AssetVerification
  """CLEAR / Verify Assist identity verification linked to this case. Null until linked."""
  identityVerification: IdentityVerification
  """Rule-based Case Assist findings + optional Claude narrative."""
  caseAssist: CaseAssistResult!
}

type MedicaidEeCaseConnection {
  data: [MedicaidEeCase!]!
  pagination: PaginationInfo!
}

input MedicaidEeCaseFilter {
  status: MedicaidEeCaseStatus
  caseType: MedicaidEeCaseType
  householdId: ID
  """Filter to cases whose applicant is this identity-service personId."""
  applicantPersonId: ID
}

input MedicaidEeCaseDocumentInput {
  s3Key: String!
  documentCategory: String!
}

input CreateMedicaidEeCaseInput {
  householdId: ID!
  """Supergraph: ID!. Demo relaxation: defaults to the household HEAD (the admin's CreateEECase omits it)."""
  applicantPersonId: ID
