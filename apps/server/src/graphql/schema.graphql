# ── Verify Assist / Case Assist (demo additions) ──────────────────────────────────

type IdentityVerification {
  id: ID!
  """Always CLEAR."""
  provider: String!
  """awaiting_user | in_progress | success | failed | expired"""
  status: String!
  """mock | sandbox"""
  mode: String!
  subjectName: String
  createdAt: String!
  completedAt: String
  """Curated identity-relevant CLEAR checks (see server clear/check-curation.ts); category headers, phone/device and NFC rows are folded into checksSummary."""
  checks: [VerificationCheck!]!
  """e.g. "8 identity checks passed · 13 additional CLEAR checks passed · 3 not applicable"; null when no checks."""
  checksSummary: String
  traits: IdentityTraits
  determination: CoverageDetermination
  """ended_submit_proof | confirm_enrolled | null"""
  resolution: String
  """Set when the applicant chose ended_submit_proof and uploaded a file."""
  proofDocument: VerificationProofDocument
  """Staff-only; null for residents."""
  flag: VerifyAssistFlag
}

type VerificationCheck {
  name: String!
  status: String!
}

type IdentityTraits {
  document: DocumentTraits
  phone: String
  ssnLast4: String
}

type DocumentTraits {
  first_name: String
  middle_name: String
  last_name: String
  date_of_birth: String
  address_line1: String
  address_line2: String
  city: String
  state: String
  postal_code: String
  document_type: String
  issuing_state: String
  document_number_last4: String
  expiration_date: String
  gender: String
}

type CoverageDetermination {
  """issue_found | clear"""
  result: String!
  duplicate_enrollment: Boolean!
  payer_state: String
  payer_state_name: String
  """Staff-only (null for residents)."""
  coverage: HealthInsuranceTraits
}

type HealthInsuranceTraits {
  payer_id: String
  payer_name: String
  plan_status: String
  insurance_member_id: String
  policy_holder_first_name: String
  policy_holder_last_name: String
  coverage_start_date: String
}

type VerifyAssistFlag {
  id: ID!
  type: String!
  status: String!
  assignee: String
  dispositionReason: String
  details: JSON
  notes: [FlagNote!]!
  createdAt: String!
  updatedAt: String!
}

type FlagNote {
  id: ID!
  author: String!
  body: String!
  createdAt: String!
}

type CaseAssistResult {
  recommendations: [CaseAssistRecommendation!]!
  narrative: String
  """claude | template"""
  narrativeSource: String!
  generatedAt: String!
}

type CaseAssistRecommendation {
  id: ID!
  """guidance | draft_task | draft_notice"""
  type: String!
  """1 act now, 2 soon, 3 fyi"""
  priority: Int!
  """critical | warning | info"""
  severity: String!
  """verify_assist | rules | intake"""
  source: String!
  title: String!
  body: String!
  rationale: CaseAssistRationale!
  suggestedActions: [String!]!
}

type CaseAssistRationale {
  summary: String!
  citedFieldPaths: [String!]!
}

input UpdateVerifyAssistFlagInput {
  flagId: ID!
  status: String
  dispositionReason: String
  note: String
  assignee: String
}

type PayloadError {
  code: String!
  message: String!
  field: String
}

type UpdateVerifyAssistFlagPayload {
  flag: VerifyAssistFlag
  errors: [PayloadError!]!
}

