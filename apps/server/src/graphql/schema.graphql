  APPLICATION_FORM
  INCOME_PAYSTUB
  INCOME_W2
  INCOME_1099
  INCOME_BENEFIT_LETTER
  IDENTITY_PHOTO_ID
  IDENTITY_PASSPORT
  ADDRESS_PROOF
  BANK_STATEMENT
  ENROLLMENT
}

enum DocumentErrorCode {
  UNAUTHENTICATED
  RATE_LIMITED
  BAD_USER_INPUT
  NOT_FOUND
  FORBIDDEN
  VALIDATION_ERROR
  UNIQUE_CONSTRAINT
  CONFIGURATION_ERROR
  SCAN_NOT_COMPLETE
  SCAN_FAILED
  COPY_FAILED
  PDF_GENERATION_FAILED
  STORAGE_FAILED
  PERSISTENCE_FAILED
  DELETE_FAILED
  CHECK_UNAVAILABLE
  CHECK_FAILED
}

type DocumentError {
  code: DocumentErrorCode!
