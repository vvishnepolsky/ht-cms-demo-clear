  notes: String
  documentId: ID
  intakeData: JSON
  draftId: ID
  documents: [MedicaidEeCaseDocumentInput!]
  """Demo addition: Verify Assist verification to link. Falls back to the caller's latest completed applicant verification."""
  identityVerificationId: ID
}

type CreateMedicaidEeCasePayload {
  case: MedicaidEeCase
