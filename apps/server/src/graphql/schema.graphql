# ── roots ─────────────────────────────────────────────────────────────────────────

type Query {
  me: MeUser
  residentMe: ResidentUser
  person(personId: ID!): Person
  household(id: ID!, customerId: ID!): Household
  householdList(customerId: ID!, pagination: PaginationInput): HouseholdConnection!
  medicaidEeCase(id: ID!): MedicaidEeCase
  medicaidEeCases(filter: MedicaidEeCaseFilter, pagination: PaginationInput): MedicaidEeCaseConnection!
  medicaidAuditLog(filter: AuditLogFilter!, pagination: PaginationInput): AuditLogPage!
  eligibilityNotice(caseId: ID!): EligibilityNoticePayload!
}

type Mutation {
  createPerson(input: CreatePersonInput!): CreatePersonPayload!
  updatePerson(input: UpdatePersonInput!): UpdatePersonPayload!

  createHousehold(input: CreateHouseholdInput!): CreateHouseholdPayload!
  addHouseholdMember(input: AddHouseholdMemberInput!): AddHouseholdMemberPayload!
  removeHouseholdMember(input: RemoveHouseholdMemberInput!): RemoveHouseholdMemberPayload!

  createMedicaidEeCase(input: CreateMedicaidEeCaseInput!): CreateMedicaidEeCasePayload!
  queueForReviewMedicaidEeCase(input: CaseTransitionInput!): CaseTransitionPayload!
  approveMedicaidEeCase(input: CaseTransitionInput!): CaseTransitionPayload!
  denyMedicaidEeCase(input: CaseTransitionWithReasonInput!): CaseTransitionPayload!
  cancelMedicaidEeCase(input: CaseTransitionWithReasonInput!): CaseTransitionPayload!
  issueMedicaidEeCaseRfi(input: IssueMedicaidEeCaseRfiInput!): CaseTransitionPayload!
  resolveMedicaidEeCaseRfi(input: ResolveMedicaidEeCaseRfiInput!): CaseTransitionPayload!

  createArgyleUser(input: CreateArgyleUserInput!): CreateArgyleUserPayload!
  getPayrollLinkToken(input: GetPayrollLinkTokenInput!): GetPayrollLinkTokenPayload!
  requestIncomeVerification(input: RequestIncomeVerificationInput!): RequestIncomeVerificationPayload!
  getArgyleBankingConnectUrl(input: GetBankingConnectUrlInput!): GetBankingConnectUrlPayload!
  requestAssetVerification(input: RequestAssetVerificationInput!): RequestAssetVerificationPayload!

  createDocument(input: CreateDocumentInput!): CreateDocumentPayload!
  confirmDocumentUpload(input: ConfirmDocumentUploadInput!): ConfirmDocumentUploadPayload!
  extractDocumentFields(input: ExtractDocumentFieldsInput!): ExtractDocumentFieldsPayload!
  requestDraftUploadUrl(input: RequestDraftUploadUrlInput!): RequestDraftUploadUrlPayload!

  """Caseworker works the out-of-state Medicaid flag from the Case Assist panel."""
  updateVerifyAssistFlag(input: UpdateVerifyAssistFlagInput!): UpdateVerifyAssistFlagPayload!

  # Resident GraphQL auth (the ported resident app uses the identity REST; these
  # exist so every document in apps/resident/src/lib/operations.ts validates).
  loginResident(input: LoginResidentInput!): ResidentAuthPayload!
  createResidentAccount(input: CreateResidentAccountInput!): ResidentAuthPayload!
  logoutResident: LogoutResidentPayload!
  refreshResidentToken: RefreshTokenPayload!
  refreshToken: RefreshTokenPayload!
}
