  MESSAGE_ATTACHMENT
}
enum DocumentSensitivityLevel { STANDARD CONFIDENTIAL RESTRICTED }
enum DocumentRetentionPolicy { STANDARD_1_YEAR HIPAA_6_YEAR HIPAA_7_YEAR LEGAL_HOLD }
enum DocumentProgram {
  MEDICAID_EE
  MEDICAID_CEV
  SUN_BUCKS
  SNAP
  ALIGN
  COMMUNITY_ENGAGEMENT
