# State-X E&E demo — pruned single-service replica of the ht-platform
# supergraph (identity-service, household-service, medicaid-ee-service,
# document-service) plus the Verify Assist / Case Assist additions documented in
# docs/api-contract.md. Field names, nullability and enums follow the supergraph.

scalar JSON
scalar DateTime

# ── shared ───────────────────────────────────────────────────────────────────────

input PaginationInput {
  page: Int
  limit: Int
}

type PaginationInfo {
  currentPage: Int!
  totalPages: Int!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

