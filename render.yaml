# Render Blueprint — one web service serving the State-X E&E demo:
#   resident wizard at /, Verify Assist hosted flow at /verify, caseworker admin at /admin,
#   REST at /api and GraphQL at /graphql, SQLite on a persistent disk.
#
# First deploy is self-contained (mock CLEAR, template Case Assist narratives).
# Real services are enabled by setting secrets in the Render dashboard:
#   MOCK_CLEAR=false + CLEAR_API_KEY + CLEAR_PROJECT_ID   → real CLEAR sandbox
#   DEMO_ENRICHMENT=true                                  → deterministic SC Medicaid storyline on sandbox runs
#   ANTHROPIC_API_KEY                                     → Claude-written Case Assist narratives
# Register <service-url>/verify/flow as the CLEAR project's redirect URL.
services:
  - type: web
    name: ht-cms-demo-clear
    runtime: node
    repo: https://github.com/vvishnepolsky/ht-cms-demo-clear
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: ht-cms-demo-clear-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/demo.db
      - key: VERIFY_ASSIST_TENANT_STATE
        value: SX
      # ── CLEAR ── sandbox mode with the deterministic demo overlay (user decision 2026-09-14).
      # Until CLEAR_API_KEY / CLEAR_PROJECT_ID are set in the dashboard, the server
      # falls back to mock mode automatically and logs a warning.
      - key: MOCK_CLEAR
        value: "false"
      - key: DEMO_ENRICHMENT
        value: "true"
      # Demo identity — edit in the dashboard to change who the storyline is about.
      - key: DEMO_APPLICANT_FIRST_NAME
        value: Jordan
      - key: DEMO_APPLICANT_LAST_NAME
        value: Rivera
      - key: DEMO_APPLICANT_DOB
        value: "1991-01-10"
      - key: DEMO_HOUSEHOLD_FIRST_NAME
        value: Sam
      - key: DEMO_HOUSEHOLD_LAST_NAME
        value: Rivera
      - key: DEMO_HOUSEHOLD_DOB
        value: "1993-03-14"
      # Coverage the demo applicant carries: oos_medicaid (SC Medicaid finding + flag) or
      # employer_plan (Aetna employer plan → no flag, insurance step prefilled, TPL note).
      - key: DEMO_COVERAGE_SCENARIO
        value: oos_medicaid
      # Optional (set in the dashboard): comma-separated document fields to take from
      # CLEAR's real result instead of the demo identity, e.g. first_name,last_name,dob.
      - key: DEMO_ENRICHMENT_PASSTHROUGH
        sync: false
      - key: CLEAR_API_KEY
        sync: false
      - key: CLEAR_PROJECT_ID
        sync: false
      # ── Case Assist narrative ── optional
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CASE_ASSIST_MODEL
        value: claude-opus-5
